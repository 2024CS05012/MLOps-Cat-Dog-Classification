name: CD

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: read

jobs:
  deploy-and-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install smoke test dependencies
        run: pip install requests

      - name: Build deployment image
        run: docker build -t cats-dogs-mlops:latest .

      - name: Deploy with Docker Compose
        run: docker compose -f deployment/docker-compose.yml up -d

      - name: Wait for API
        run: sleep 15

      - name: Run smoke test
        run: python scripts/smoke_test.py --base-url http://localhost:8000
