name: CD

on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]

permissions:
  contents: read
  packages: read

jobs:
  deploy-and-smoke-test:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install smoke test dependencies
        run: pip install requests

      - name: Restore DVC metadata/artifacts for smoke inputs
        run: |
          pip install dvc==3.58.0
          dvc pull || true

      - name: Set deployment image
        run: |
          REPOSITORY_LOWER="${GITHUB_REPOSITORY,,}"
          echo "IMAGE_NAME=ghcr.io/${REPOSITORY_LOWER}/cats-dogs-mlops:latest" >> "$GITHUB_ENV"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull deployment image
        run: docker pull "$IMAGE_NAME"

      - name: Deploy with Docker Compose
        run: docker compose -f deployment/docker-compose.yml up -d --no-build
        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}

      - name: Wait for API
        run: sleep 15

      - name: Run smoke test
        run: python scripts/smoke_test.py --base-url http://localhost:8000
