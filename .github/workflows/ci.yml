name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  test-build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore or rebuild DVC artifacts
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          DVC_REMOTE_NAME: ${{ secrets.DVC_REMOTE_NAME || 'storage' }}
          DVC_REMOTE_URL: ${{ secrets.DVC_REMOTE_URL }}
        run: |
          set +e

          if [ -n "$DVC_REMOTE_URL" ]; then
            echo "Configuring DVC remote $DVC_REMOTE_NAME from GitHub secret..."
            dvc remote remove "$DVC_REMOTE_NAME" >/dev/null 2>&1 || true
            dvc remote add -d "$DVC_REMOTE_NAME" "$DVC_REMOTE_URL"
          fi

          dvc pull
          pull_status=$?

          if [ $pull_status -eq 0 ]; then
            echo "Restored artifacts from DVC remote."
            exit 0
          fi

          echo "DVC pull did not succeed. Checking for Kaggle credentials..."

          if [ -z "$KAGGLE_USERNAME" ] || [ -z "$KAGGLE_KEY" ]; then
            echo "No DVC remote configured and no Kaggle credentials available."
            echo "CI requires artifacts/models/best_model.pt before Docker build."
            echo "Configure DVC_REMOTE_URL or KAGGLE_USERNAME/KAGGLE_KEY repository secrets."
            exit 1
          fi

          mkdir -p ~/.kaggle
          printf '{"username":"%s","key":"%s"}' "$KAGGLE_USERNAME" "$KAGGLE_KEY" > ~/.kaggle/kaggle.json
          chmod 600 ~/.kaggle/kaggle.json
          python scripts/download_kaggle_dataset.py \
            --dataset-name bhavikjikadara/dog-and-cat-classification-dataset \
            --output-dir data/raw
          dvc repro

      - name: Verify model artifact for image build
        run: test -f artifacts/models/best_model.pt

      - name: Run unit tests
        run: pytest

      - name: Set image names
        run: |
          REPOSITORY_LOWER="${GITHUB_REPOSITORY,,}"
          echo "IMAGE_NAME_SHA=ghcr.io/${REPOSITORY_LOWER}/cats-dogs-mlops:${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "IMAGE_NAME_LATEST=ghcr.io/${REPOSITORY_LOWER}/cats-dogs-mlops:latest" >> "$GITHUB_ENV"

      - name: Build Docker image
        run: docker build -t "$IMAGE_NAME_SHA" -t "$IMAGE_NAME_LATEST" .

      - name: Login to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image
        if: github.event_name == 'push'
        run: |
          docker push "$IMAGE_NAME_SHA"
          docker push "$IMAGE_NAME_LATEST"
