stages:
  preprocess:
    cmd: python3 scripts/preprocess_data.py
    deps:
      - data/raw
      - scripts/preprocess_data.py
      - src/data/preprocess.py
    outs:
      - data/processed
  train:
    cmd: python3 scripts/train_model.py --epochs 1 --batch-size 8 --max-train-samples 256 --max-eval-samples 64
    deps:
      - data/processed
      - scripts/train_model.py
      - src/models/train.py
      - src/models/model.py
    outs:
      - artifacts/models/best_model.pt
      - artifacts/models/latest_model.pt
    plots:
      - artifacts/plots/loss_curve.png
      - artifacts/plots/accuracy_curve.png
      - artifacts/plots/confusion_matrix.png
